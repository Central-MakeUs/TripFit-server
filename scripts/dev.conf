BUILD_CMD=./gradlew build --no-daemon
TEST_CMD=./gradlew test --no-daemon --rerun-tasks
TEST_REPORT=junit:build/test-results/test/TEST-*.xml
FMT_CMD=./gradlew spotlessApply
DEPS_CMD=./gradlew dependencies
RUN_ENV=없음 — bootRun이 프로젝트의 로컬 환경을 읽는다.
SERVICES=mysql
EXTRA_CONTAINERS=없음 — 로컬 기본 구성은 Compose MySQL을 사용한다.
WAIT_SERVICES=60
START_CMD=./gradlew bootRun
APP_PORT=8080
HEALTH_URL=http://localhost:8080/actuator/health/readiness
WAIT_HEALTH=120
LOG_DIR=.codex/harness-state/dev
