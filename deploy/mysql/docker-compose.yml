# EC2 B — MySQL 전용 서버
# 사용: cp .env.example .env → 값 설정 → docker compose up -d
#
# 로그: Loki docker logging driver로 EC2 C(deploy/monitoring/)에 전송한다.
# 최초 1회 필요: docker plugin install grafana/loki-docker-driver:latest \
#   --alias loki --grant-all-permissions
services:
  mysql:
    image: mysql:8.0
    container_name: tripfit-mysql
    restart: unless-stopped
    command:
      - mysqld
      - --binlog-expire-logs-seconds=86400
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --max_connections=200
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      TZ: Asia/Seoul
    ports:
      # VPC 내부 전용 권장. public 바인딩은 dev 임시용만.
      - "${MYSQL_BIND:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: loki
      options:
        loki-url: "http://${LOKI_HOST:-172.31.38.217}:3100/loki/api/v1/push"
        loki-retries: "3"
        loki-batch-size: "400"

volumes:
  mysql_data:
