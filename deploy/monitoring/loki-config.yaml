auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

limits_config:
  # 확정값(3일, 2026-08-01) — EC2 C 디스크가 6.7GB뿐이라(현재 71% 사용, 2GB 여유) 보수적으로 설정.
  # docs/decisions/009-observability-logging.md "로그 보존 기간 정책" 참고.
  retention_period: 72h

query_scheduler:
  # 대시보드 다중 패널 동시 조회 시 기본값(100)으로는 "too many outstanding requests"(HTTP 429) 발생 — 여유값으로 상향.
  max_outstanding_requests_per_tenant: 2048

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
