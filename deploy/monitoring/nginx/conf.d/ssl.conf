# grafana.tripfit.online — HTTPS (Grafana :3000)

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name grafana.tripfit.online;

    ssl_certificate     /etc/letsencrypt/live/grafana.tripfit.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.tripfit.online/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # Docker embedded DNS — grafana 호스트명을 요청 시점에 해석
    resolver 127.0.0.11 ipv6=off valid=10s;

    location / {
        set $upstream_grafana grafana;
        proxy_pass http://$upstream_grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Grafana Live(WebSocket)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
