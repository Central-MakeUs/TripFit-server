# =============================================================================
# EC2 C — 로깅·모니터링 전용 (Loki + Grafana)
# =============================================================================
# 결정 근거·대안 비교: docs/decisions/009-observability-logging.md (Issue #77)
# EC2 A/B의 컨테이너 로그를 Loki(docker logging driver)로 전송받아,
# Grafana에서 SSH 없이 검색·조회한다.
# nginx(:80/:443) → grafana:3000. HTTPS는 grafana.tripfit.online — TLS 최초 발급은
# deploy/app과 동일 스크립트 재사용:
#   ../../scripts/ensure-ssl-certs.sh (DEPLOY_DIR=deploy/monitoring CERTBOT_DOMAIN=grafana.tripfit.online)
#   docker compose up -d
#   CERTBOT_EMAIL=... ../../scripts/init-letsencrypt.sh (DEPLOY_DIR=deploy/monitoring CERTBOT_DOMAIN=grafana.tripfit.online)
#
# 배포: .github/workflows/deploy-observability.yml의 deploy-monitoring 작업이 GitHub Secrets 값을 환경 변수로 넣어 띄운다.
# 서버의 .env는 만들거나 고치지 않는다(.claude/rules/deployment.md).
# 아래 Secrets 값들은 "없으면 빈 값"으로 둔다. 빈 값 배포는 CI가 먼저 막고, 인증서 갱신 cron
# (scripts/renew-letsencrypt.sh → docker compose run certbot)은 이 값 없이도 돌아야 하기 때문이다.
# 그러니 C에서 손으로 `docker compose up`을 하지 말고 CI(수동 실행 가능)로만 배포한다.
# =============================================================================
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: tripfit-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      grafana:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot:v3.0.1
    container_name: tripfit-certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet \
            --deploy-hook "echo renew-ok-$(date -Iseconds) > /etc/letsencrypt/last-renew"
          sleep 12h & wait $$!
        done
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  loki:
    image: grafana/loki:2.9.4
    container_name: tripfit-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana-oss:10.4.2
    container_name: tripfit-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: grafana.tripfit.online
      GF_SERVER_ROOT_URL: https://grafana.tripfit.online/
      TZ: Asia/Seoul
      # 감시 규칙이 연락처를 규칙마다 직접 지정하려면 필요하다(grafana-provisioning/alerting/tripfit-watch.yaml).
      GF_FEATURE_TOGGLES_ENABLE: alertingSimplifiedRouting
      # 아래 값은 provisioning 파일의 $변수로 들어간다 — #126 임계점 감시(EC2 E Prometheus·AI 원인 리포터)
      PROMETHEUS_URL: http://${PROMETHEUS_HOST:-}:9090
      REPORTER_URL: http://${PROMETHEUS_HOST:-}:9095/alerts
      REPORTER_TOKEN: ${REPORTER_TOKEN:-}
      ENVIRONMENT_NAME: prod
      WATCH_INTERVAL: 1m
      WATCH_FOR_USAGE: 10m
      WATCH_FOR_POOL: 5m
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana-provisioning/alerting:/etc/grafana/provisioning/alerting:ro
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  loki_data:
  grafana_data:
  certbot_www:
  certbot_conf:
