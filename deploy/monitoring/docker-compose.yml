# =============================================================================
# EC2 C — 로깅·모니터링 전용 (Loki + Grafana)
# =============================================================================
# 결정 근거·대안 비교: docs/decisions/009-observability-logging.md (Issue #77)
# EC2 A/B의 컨테이너 로그를 Loki(docker logging driver)로 전송받아,
# Grafana에서 SSH 없이 검색·조회한다.
#
# 최초 설정:
#   cp .env.example .env   # GRAFANA_ADMIN_PASSWORD 채우기
#   docker compose up -d
# =============================================================================
services:
  loki:
    image: grafana/loki:2.9.4
    container_name: tripfit-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana-oss:10.4.2
    container_name: tripfit-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      TZ: Asia/Seoul
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  loki_data:
  grafana_data:
