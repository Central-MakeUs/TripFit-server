include /etc/nginx/tls-enabled/*.conf;

server {
    listen 80 default_server;
    server_name api.tripfit.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location /actuator/ {
        return 404;
    }

    location / {
        return 301 https://api.tripfit.online$request_uri;
    }
}
