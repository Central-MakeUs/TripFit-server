# 로컬 임계점 — 기준값 SSOT: docs/specs/cross-cutting/add-prometheus.md "감시 규칙" 표의 로컬 열.
# 배포 전 점검은 앱·DB 없이 가짜 알림만 보낸다. 감시 규칙은 수치가 없으면 "수치 없음" 발생으로 리포터를 부르므로
# (noDataState: Alerting), 점검 중에 가짜 리포트가 쏟아지지 않게 사용률 수치를 항상 0으로 채워 둔다.
groups:
  - name: tripfit-usage-placeholder
    rules:
      - record: tripfit:app_cpu_usage:ratio
        expr: vector(0)
      - record: tripfit:app_heap_usage:ratio
        expr: vector(0)
      - record: tripfit:db_cpu_usage:ratio
        expr: vector(0)
      - record: tripfit:db_memory_usage:ratio
        expr: vector(0)
      - record: tripfit:db_pool_pending
        expr: vector(0)
  - name: tripfit-thresholds
    rules:
      - record: tripfit:threshold
        expr: vector(0.7)
        labels: {rule: app_cpu}
      - record: tripfit:threshold
        expr: vector(0.7)
        labels: {rule: app_memory}
      - record: tripfit:threshold
        expr: vector(0.7)
        labels: {rule: db_cpu}
      - record: tripfit:threshold
        expr: vector(0.7)
        labels: {rule: db_memory}
      - record: tripfit:threshold
        expr: vector(0)
        labels: {rule: db_pool}
