# 배포 전 로컬 점검용 Prometheus. 앱·DB 없이 리포터만 수집한다(부하 검증은 PR 2의 loadtest/observability/).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: incident-reporter
    static_configs:
      - targets: ["incident-reporter:9095"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
