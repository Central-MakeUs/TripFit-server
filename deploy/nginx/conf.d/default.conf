# api.tripfit.online — HTTP
# 1) Let's Encrypt ACME webroot
# 2) /health (로드밸런서·배포 스크립트)
# 3) 나머지 → HTTPS 리다이렉트

server {
    listen 80;
    listen [::]:80;
    server_name api.tripfit.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # 앱 수치 — EC2 E(Prometheus, 172.31.43.92)에서 사설망으로 가져가는 경로만 연다.
    # 다른 출발지는 막고, 나머지 /actuator/*는 HTTPS 쪽 proxy-api.conf에서 계속 404다.
    # 스펙: docs/specs/cross-cutting/add-prometheus.md "스크래핑 경로"
    location = /actuator/prometheus {
        allow 172.31.43.92;
        deny all;
        access_log off;
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $upstream_app app;
        proxy_pass http://$upstream_app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://api.tripfit.online$request_uri;
    }
}
