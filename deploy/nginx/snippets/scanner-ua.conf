# 알려진 콘텐츠 디스커버리·취약점 스캐너 User-Agent — 2026-08-27 feroxbuster 스캔 대응
# rate limiting(nginx.conf)이 근본 방어선이고, 이건 흔한 스캐너 도구를 더 빨리 걸러내는 보조 수단
map $http_user_agent $is_scanner_ua {
    default 0;
    ~*feroxbuster 1;
    ~*gobuster 1;
    ~*dirbuster 1;
    ~*nikto 1;
    ~*sqlmap 1;
    ~*nuclei 1;
    ~*masscan 1;
    ~*nmap 1;
    ~*zgrab 1;
}
