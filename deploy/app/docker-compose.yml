# =============================================================================
# EC2 A — 백엔드 전용 (api.tripfit.online)
# =============================================================================
# 서비스: nginx(:80/:443) → app:8080 (Spring Boot)
#         certbot (Let's Encrypt 발급·갱신)
# 프론트(tripfit.online): Vercel — 이 compose에 frontend 없음
#
# 최초 HTTPS:
#   export CERTBOT_EMAIL=codus5068@naver.com
#   ../../scripts/setup-api-https.sh
# 또는:
#   ../../scripts/ec2-deploy-app.sh && ../../scripts/init-letsencrypt.sh
#
# 로그: Loki docker logging driver로 EC2 C(deploy/monitoring/)에 전송한다.
# 최초 1회 필요: docker plugin install grafana/loki-docker-driver:latest \
#   --alias loki --grant-all-permissions
# =============================================================================
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: tripfit-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - ../nginx/snippets:/etc/nginx/snippets:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging:
      driver: loki
      options:
        loki-url: "http://${LOKI_HOST:-172.31.38.217}:3100/loki/api/v1/push"
        loki-retries: "3"
        loki-batch-size: "400"

  certbot:
    image: certbot/certbot:v3.0.1
    container_name: tripfit-certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet \
            --deploy-hook "echo renew-ok-$(date -Iseconds) > /etc/letsencrypt/last-renew"
          sleep 12h & wait $$!
        done
    logging:
      driver: loki
      options:
        loki-url: "http://${LOKI_HOST:-172.31.38.217}:3100/loki/api/v1/push"
        loki-retries: "3"
        loki-batch-size: "400"

  app:
    image: ${GHCR_IMAGE:?GHCR_IMAGE is required}
    container_name: tripfit-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:-172.31.38.246}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-7200}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-30}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID_IOS: ${GOOGLE_CLIENT_ID_IOS:-}
      GOOGLE_CLIENT_ID_ANDROID: ${GOOGLE_CLIENT_ID_ANDROID:-}
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CALENDAR_CLIENT_ID:-}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      SOCIAL_TOKEN_AES_KEY: ${SOCIAL_TOKEN_AES_KEY:-}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-}
      APPLE_SERVICE_ID: ${APPLE_SERVICE_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      KAKAO_ADMIN_KEY: ${KAKAO_ADMIN_KEY:-}
      FIREBASE_CREDENTIALS_BASE64: ${FIREBASE_CREDENTIALS_BASE64:-}
      TZ: Asia/Seoul
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    logging:
      driver: loki
      options:
        loki-url: "http://${LOKI_HOST:-172.31.38.217}:3100/loki/api/v1/push"
        loki-retries: "3"
        loki-batch-size: "400"

volumes:
  certbot_www:
  certbot_conf:
