spring:
  profiles:
    default: local
  application:
    name: tripfit
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      max-lifetime: 1800000
      keepalive-time: 300000
      connection-timeout: 30000
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        type:
          preferred_uuid_jdbc_type: CHAR
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
  task:
    scheduling:
      pool:
        # 3개 @Scheduled(GoogleCalendarSyncScheduler·ScheduleReminderBatch·TripHomeScheduler)가 기본 풀(size=1)을 공유하며 서로 지연시키는 것을 방지
        size: 3
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # refresh token SSOT(RefreshTokenService)가 여기 있어 fail-closed다 — Redis 장애 시 로그인
      # 갱신 자체가 불가능해지는 리스크를 감수하기로 확정(docs/specs/auth/auth-refresh-redis-cookie.md).
      # 그래도 요청이 무한정 멈추지 않도록 연결·명령 타임아웃은 짧게 고정
      connect-timeout: 300ms
      timeout: 300ms

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        # prometheus는 nginx가 EC2 E(Prometheus 서버) private IP만 허용한다(docs/specs/cross-cutting/add-prometheus.md)
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    distribution:
      # AI 원인 리포터가 API별 p95 응답 시간을 계산할 수 있게 구간 몇 개만 둔다.
      # 전체 히스토그램(percentiles-histogram)은 시계열이 크게 늘어 Prometheus 서버(t3.micro)에 부담이 된다.
      slo:
        http.server.requests: 100ms,300ms,1s,3s,10s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

tripfit:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-must-be-at-least-32-chars}
    access-expiration-seconds: ${JWT_ACCESS_EXPIRATION:900}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}
  auth:
    cookie:
      # api.tripfit.online이 발급한 쿠키를 프론트 tripfit.online과도 공유하도록 상위 도메인으로 지정
      domain: ${COOKIE_DOMAIN:localhost}
      secure: ${COOKIE_SECURE:true}
  oauth:
    google-client-id: ${GOOGLE_CLIENT_ID:}
    google-client-secret: ${GOOGLE_CLIENT_SECRET:}
    google-client-id-ios: ${GOOGLE_CLIENT_ID_IOS:}
    google-client-id-android: ${GOOGLE_CLIENT_ID_ANDROID:}
    google-calendar-client-id: ${GOOGLE_CALENDAR_CLIENT_ID:}
    google-calendar-client-secret: ${GOOGLE_CALENDAR_CLIENT_SECRET:}
    apple-bundle-id: ${APPLE_BUNDLE_ID:}
    apple-service-id: ${APPLE_SERVICE_ID:}
    apple-team-id: ${APPLE_TEAM_ID:}
    apple-key-id: ${APPLE_KEY_ID:}
    apple-private-key: ${APPLE_PRIVATE_KEY:}
    kakao-admin-key: ${KAKAO_ADMIN_KEY:}
  security:
    token-aes-key: ${SOCIAL_TOKEN_AES_KEY:}
  fcm:
    credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}
  holiday:
    service-key: ${HOLIDAY_API_SERVICE_KEY:}
