spring:
  datasource:
    url: jdbc:h2:mem:tripfit;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

tripfit:
  jwt:
    secret: test-jwt-secret-key-at-least-32-characters
    access-expiration-seconds: 7200
    refresh-expiration-days: 30
  oauth:
    google-client-id: test-google-client-id
    google-client-secret: test-google-client-secret
    google-client-id-ios: test-google-ios-client-id
    google-client-id-android: test-google-android-client-id
    google-calendar-client-id: test-google-calendar-client-id
    google-calendar-client-secret: test-google-calendar-client-secret
    apple-bundle-id: test-apple-bundle-id
    apple-service-id: test-apple-service-id
    apple-team-id: test-apple-team-id
    apple-key-id: test-apple-key-id
    apple-private-key: test-apple-private-key
    kakao-admin-key: test-kakao-admin-key
  security:
    token-aes-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
