name: Docs Link Check

on:
  pull_request:
    paths:
      - "**/*.md"
      - "lychee.toml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "lychee.toml"

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress '**/*.md'
          fail: true
          jobSummary: true
