name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tripfit-server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Check code format
        run: ./gradlew spotlessCheck --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html
          retention-days: 14

      - name: Build JAR
        run: ./gradlew bootJar --no-daemon -x test

  api-contract-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Export current OpenAPI spec
        run: ./gradlew test --tests "com.tripfit.tripfit.common.config.OpenApiSpecExportTest" --no-daemon

      - name: Install oasdiff
        run: curl -fsSL https://raw.githubusercontent.com/oasdiff/oasdiff/main/install.sh | sh

      - name: Fetch base spec from main
        id: base_spec
        run: |
          if curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/docs/api/openapi.json" -o base-openapi.json; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false — 최초 실행, breaking 비교 스킵" >> "$GITHUB_OUTPUT"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine commit range
        id: range
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "range=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "range=${{ github.event.before }}..${{ github.event.after }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check breaking changes and notify Discord
        # PR 병합(pull_request 이벤트)에서 이미 알림을 보낸 diff를 main push에서 또 보내면 중복이라 스킵한다.
        # 단, PR 없이 브랜치를 로컬 merge 후 main에 직접 push한 경우(#67 사고 — pull_request 이벤트 자체가
        # 없었음) 이 조건만으로는 알림이 영원히 안 나간다. GitHub PR "Create a merge commit" 병합은 항상
        # "Merge pull request #N from ..." 형식 커밋 메시지를 남기므로(CONTRIBUTING.md Merge 정책 —
        # Squash 금지), 그 패턴이 아닌 push는 PR을 거치지 않은 것으로 간주해 알림을 보낸다.
        # (rebase merge처럼 팀 합의된 예외 전략을 쓰면 이 휴리스틱이 놓칠 수 있음 — 근본 해결은 main
        # 브랜치 보호 규칙으로 직접 push 자체를 막는 것)
        if: |
          steps.base_spec.outputs.exists == 'true' &&
          (github.event_name == 'pull_request' ||
           (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Merge pull request #')))
        env:
          BASE_SPEC: base-openapi.json
          REVISED_SPEC: build/openapi/openapi.json
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GIT_RANGE: ${{ steps.range.outputs.range }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DISCORD_BOT_AVATAR_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/docs/api/tripfit_app_icon.png
        run: ./scripts/notify-api-breaking-change.sh

      - name: Refresh OpenAPI snapshot on main
        # breaking 여부와 무관하게 main 상태를 그대로 기록 — deploy를 막지 않으므로 스냅샷도 항상 최신화
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          jq . build/openapi/openapi.json > docs/api/openapi.json
          if git diff --quiet -- docs/api/openapi.json; then
            echo "스펙 변경 없음 — 커밋 스킵"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/api/openapi.json
          git commit -m "Chore: OpenAPI 스펙 스냅샷 갱신 [skip ci]"
          # main에 동시 push가 겹치면 거부되므로 rebase 후 재시도(#4·#35 병합 사고 재발 방지)
          for i in 1 2 3 4 5; do
            if git push; then
              break
            fi
            echo "push 거부됨(동시 push, 시도 ${i}/5) — main rebase 후 재시도"
            sleep $((i * 2))
            git pull --rebase origin main
          done

  publish-image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name (lowercase)
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "full=${{ env.REGISTRY }}/${owner}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.full }}:${{ github.sha }}
