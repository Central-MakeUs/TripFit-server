name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tripfit-server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Check code format
        run: ./gradlew spotlessCheck --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html
          retention-days: 14

      - name: Build JAR
        run: ./gradlew bootJar --no-daemon -x test

  api-contract-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Export current OpenAPI spec
        run: ./gradlew test --tests "com.tripfit.tripfit.common.config.OpenApiSpecExportTest" --no-daemon

      - name: Install oasdiff
        shell: bash
        run: curl -fsSL https://raw.githubusercontent.com/oasdiff/oasdiff/main/install.sh | sh

      - name: Fetch base spec from main
        id: base_spec
        run: |
          status=$(curl -sSL -o base-openapi.json -w '%{http_code}' \
            "https://raw.githubusercontent.com/${{ github.repository }}/main/docs/api/openapi.json")
          case "$status" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "기준 OpenAPI 조회 실패 (HTTP $status)" >&2; exit 1 ;;
          esac

      - name: Determine commit range
        id: range
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "range=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "range=${{ github.event.before }}..${{ github.event.after }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check breaking changes and notify Discord
        if: steps.base_spec.outputs.exists == 'true'
        env:
          # PR에서 이미 알린 병합 커밋은 비교만 수행한다. 직접 push의 변경은 기존처럼 알린다.
          DRY_RUN: >-
            ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Merge pull request #') }}
          BASE_SPEC: base-openapi.json
          REVISED_SPEC: build/openapi/openapi.json
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GIT_RANGE: ${{ steps.range.outputs.range }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DISCORD_BOT_AVATAR_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/docs/api/tripfit_app_icon.png
        run: ./scripts/notify-api-breaking-change.sh

      - name: Refresh OpenAPI snapshot on main
        # 계약 변경 알림 여부와 관계없이 main의 스냅샷을 갱신한다.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          jq . build/openapi/openapi.json > docs/api/openapi.json
          if git diff --quiet -- docs/api/openapi.json; then
            echo "스펙 변경 없음 — 커밋 스킵"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/api/openapi.json
          git commit -m "Chore: OpenAPI 스펙 스냅샷 갱신 [skip ci]"
          # main에 동시 push가 겹치면 거부되므로 rebase 후 재시도(#4·#35 병합 사고 재발 방지)
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            if [[ "$i" == 5 ]]; then
              echo "OpenAPI 스냅샷 push 실패 (5회 시도)" >&2
              exit 1
            fi
            echo "push 거부됨(동시 push, 시도 ${i}/5) — main rebase 후 재시도"
            sleep $((i * 2))
            git pull --rebase origin main
          done

  publish-image:
    needs: [test, api-contract-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name (lowercase)
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "full=${{ env.REGISTRY }}/${owner}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.full }}:${{ github.sha }}
