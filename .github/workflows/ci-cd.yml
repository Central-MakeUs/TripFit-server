name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tripfit-server

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Check code format
        run: ./gradlew spotlessCheck --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Build JAR
        run: ./gradlew bootJar --no-daemon -x test

  api-contract-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Export current OpenAPI spec
        run: ./gradlew test --tests "com.tripfit.tripfit.common.config.OpenApiSpecExportTest" --no-daemon

      - name: Install oasdiff
        run: curl -fsSL https://raw.githubusercontent.com/oasdiff/oasdiff/main/install.sh | sh

      - name: Fetch base spec from main
        id: base_spec
        run: |
          if curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/docs/api/openapi.json" -o base-openapi.json; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false — 최초 실행, breaking 비교 스킵" >> "$GITHUB_OUTPUT"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine commit range
        id: range
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "range=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "range=${{ github.event.before }}..${{ github.event.after }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check breaking changes and notify Discord
        # PR 시점에만 알림 — main push는 이미 PR에서 리뷰된 동일 diff라 중복 발송 방지
        if: steps.base_spec.outputs.exists == 'true' && github.event_name == 'pull_request'
        env:
          BASE_SPEC: base-openapi.json
          REVISED_SPEC: build/openapi/openapi.json
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GIT_RANGE: ${{ steps.range.outputs.range }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DISCORD_BOT_AVATAR_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/docs/api/tripfit_app_icon.png
        run: ./scripts/notify-api-breaking-change.sh

      - name: Refresh OpenAPI snapshot on main
        # breaking 여부와 무관하게 main 상태를 그대로 기록 — deploy를 막지 않으므로 스냅샷도 항상 최신화
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          jq . build/openapi/openapi.json > docs/api/openapi.json
          if git diff --quiet -- docs/api/openapi.json; then
            echo "스펙 변경 없음 — 커밋 스킵"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/api/openapi.json
          git commit -m "Chore: OpenAPI 스펙 스냅샷 갱신 [skip ci]"
          git push

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name (lowercase)
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "full=${{ env.REGISTRY }}/${owner}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.full }}:${{ github.sha }}
            ${{ steps.image.outputs.full }}:latest

      - name: Deploy to EC2 A
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_IMAGE: ${{ steps.image.outputs.full }}:latest
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          SPRING_PROFILES_ACTIVE: ${{ secrets.SPRING_PROFILES_ACTIVE }}
          APP_PORT: ${{ secrets.APP_PORT }}
          NGINX_HTTP_PORT: ${{ secrets.NGINX_HTTP_PORT }}
          NGINX_HTTPS_PORT: ${{ secrets.NGINX_HTTPS_PORT }}
          CERTBOT_DOMAIN: ${{ secrets.CERTBOT_DOMAIN }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ACCESS_EXPIRATION: ${{ secrets.JWT_ACCESS_EXPIRATION }}
          JWT_REFRESH_EXPIRATION_DAYS: ${{ secrets.JWT_REFRESH_EXPIRATION_DAYS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID_IOS: ${{ secrets.GOOGLE_CLIENT_ID_IOS }}
          GOOGLE_CLIENT_ID_ANDROID: ${{ secrets.GOOGLE_CLIENT_ID_ANDROID }}
          GOOGLE_CALENDAR_TOKEN_AES_KEY: ${{ secrets.GOOGLE_CALENDAR_TOKEN_AES_KEY }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_PAT,GHCR_IMAGE,GHCR_USERNAME,SPRING_PROFILES_ACTIVE,APP_PORT,NGINX_HTTP_PORT,NGINX_HTTPS_PORT,CERTBOT_DOMAIN,MYSQL_HOST,MYSQL_PORT,MYSQL_DATABASE,SPRING_DATASOURCE_USERNAME,SPRING_DATASOURCE_PASSWORD,JWT_SECRET,JWT_ACCESS_EXPIRATION,JWT_REFRESH_EXPIRATION_DAYS,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_CLIENT_ID_IOS,GOOGLE_CLIENT_ID_ANDROID,GOOGLE_CALENDAR_TOKEN_AES_KEY,APPLE_CLIENT_ID
          script: |
            set -euo pipefail
            if [[ -z "${GHCR_PAT:-}" ]]; then
              echo "FAIL: GHCR_PAT secret is required (org packages are private)"
              exit 1
            fi
            docker logout ghcr.io 2>/dev/null || true
            ghcr_user="${GHCR_USERNAME:-${{ github.actor }}}"
            echo "$GHCR_PAT" | docker login ghcr.io -u "$ghcr_user" --password-stdin
            cd "${{ secrets.EC2_DEPLOY_PATH }}"
            repo_root="$(cd ../.. && pwd)"
            echo "syncing deploy config from ${repo_root}"
            # Deploy host repo should mirror origin/main exactly.
            git -C "$repo_root" fetch --prune origin main
            git -C "$repo_root" checkout -B main origin/main
            ghcr_image="${GHCR_IMAGE:-}"
            spring_profiles_active="${SPRING_PROFILES_ACTIVE:-}"
            app_port_secret="${APP_PORT:-}"
            nginx_http_port="${NGINX_HTTP_PORT:-}"
            nginx_https_port="${NGINX_HTTPS_PORT:-}"
            certbot_domain="${CERTBOT_DOMAIN:-}"
            mysql_host="${MYSQL_HOST:-}"
            mysql_port="${MYSQL_PORT:-}"
            mysql_database="${MYSQL_DATABASE:-}"
            db_user="${SPRING_DATASOURCE_USERNAME:-}"
            db_pass="${SPRING_DATASOURCE_PASSWORD:-}"
            jwt_secret="${JWT_SECRET:-}"
            jwt_access_expiration="${JWT_ACCESS_EXPIRATION:-}"
            jwt_refresh_expiration_days="${JWT_REFRESH_EXPIRATION_DAYS:-}"
            google_client_id="${GOOGLE_CLIENT_ID:-}"
            google_client_secret="${GOOGLE_CLIENT_SECRET:-}"
            google_client_id_ios="${GOOGLE_CLIENT_ID_IOS:-}"
            google_client_id_android="${GOOGLE_CLIENT_ID_ANDROID:-}"
            google_calendar_token_aes_key="${GOOGLE_CALENDAR_TOKEN_AES_KEY:-}"
            apple_client_id="${APPLE_CLIENT_ID:-}"
            if [[ -f .env ]]; then
              set -a
              # shellcheck disable=SC1091
              source .env
              set +a
            fi
            export GHCR_IMAGE="${ghcr_image:-$GHCR_IMAGE}"
            export SPRING_PROFILES_ACTIVE="${spring_profiles_active:-${SPRING_PROFILES_ACTIVE:-}}"
            export APP_PORT="${app_port_secret:-${APP_PORT:-}}"
            export NGINX_HTTP_PORT="${nginx_http_port:-${NGINX_HTTP_PORT:-}}"
            export NGINX_HTTPS_PORT="${nginx_https_port:-${NGINX_HTTPS_PORT:-}}"
            export CERTBOT_DOMAIN="${certbot_domain:-${CERTBOT_DOMAIN:-}}"
            export MYSQL_HOST="${mysql_host:?MYSQL_HOST secret is required}"
            export MYSQL_PORT="${mysql_port:-${MYSQL_PORT:-}}"
            export MYSQL_DATABASE="${mysql_database:?MYSQL_DATABASE secret is required}"
            export SPRING_DATASOURCE_USERNAME="${db_user:?SPRING_DATASOURCE_USERNAME secret is required}"
            export SPRING_DATASOURCE_PASSWORD="${db_pass:?SPRING_DATASOURCE_PASSWORD secret is required}"
            export JWT_SECRET="${jwt_secret:?JWT_SECRET secret is required}"
            export JWT_ACCESS_EXPIRATION="${jwt_access_expiration:-${JWT_ACCESS_EXPIRATION:-}}"
            export JWT_REFRESH_EXPIRATION_DAYS="${jwt_refresh_expiration_days:-${JWT_REFRESH_EXPIRATION_DAYS:-}}"
            export GOOGLE_CLIENT_ID="${google_client_id:-}"
            export GOOGLE_CLIENT_SECRET="${google_client_secret:-}"
            export GOOGLE_CLIENT_ID_IOS="${google_client_id_ios:-}"
            export GOOGLE_CLIENT_ID_ANDROID="${google_client_id_android:-}"
            export GOOGLE_CALENDAR_TOKEN_AES_KEY="${google_calendar_token_aes_key:-}"
            export APPLE_CLIENT_ID="${apple_client_id:-}"
            docker compose pull app
            # ec2-deploy-app.sh 와 동일: nginx 443 기동용 TLS material 보장
            ../../scripts/ensure-ssl-certs.sh
            docker compose up -d
            app_port="${APP_PORT:-8080}"
            nginx_port="${NGINX_HTTP_PORT:-80}"
            # app healthcheck start_period 90s + nginx depends_on — 120s(24×5)는 부족
            for i in $(seq 1 48); do
              app_ok=false
              nginx_ok=false
              if curl -fsS "http://localhost:${app_port}/actuator/health/readiness" >/dev/null 2>&1; then
                app_ok=true
              fi
              if curl -fsS "http://localhost:${nginx_port}/health" >/dev/null 2>&1; then
                nginx_ok=true
              fi
              if [[ "$app_ok" == true && "$nginx_ok" == true ]]; then
                echo "OK nginx + app readiness"
                exit 0
              fi
              echo "wait ${i}/48 — app=${app_ok} nginx=${nginx_ok}"
              sleep 5
            done
            echo "FAIL readiness timeout"
            docker compose ps -a
            if docker inspect tripfit-app >/dev/null 2>&1; then
              docker inspect tripfit-app --format 'app health={{.State.Health.Status}}'
              docker logs tripfit-app 2>&1 | tail -80
            else
              echo "WARN: tripfit-app container not found"
            fi
            if docker inspect tripfit-nginx >/dev/null 2>&1; then
              docker inspect tripfit-nginx --format 'nginx health={{.State.Health.Status}}'
              docker logs tripfit-nginx 2>&1 | tail -40
            else
              echo "WARN: tripfit-nginx not started (waits for app healthy — check app logs/DB)"
            fi
            exit 1
