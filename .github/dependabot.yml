version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Chore"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Chore"

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/deploy/*"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Chore"
