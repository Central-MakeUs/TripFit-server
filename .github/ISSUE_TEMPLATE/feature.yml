name: Feature
description: 새 API, 엔티티, 비즈니스 기능
title: "[Feat] "
labels:
  - "kind: feature"
body:
  - type: markdown
    attributes:
      value: |
        계획 축: [`docs/product/development-wave.md`](../../docs/product/development-wave.md) — Milestone(`MVP 출시`/`출시 이후`)은 이슈 생성 시 사이드바에서 직접 지정
        DB·인증·다파일 변경 시 merge 전 [`docs/specs/`](../../docs/specs/) 스펙 링크 필요.
        본문은 아래 섹션 순서를 유지하면 Agent·PR과 연동하기 쉽습니다.

  - type: dropdown
    id: priority
    attributes:
      label: priority (우선순위)
      description: "성능 개선·폴더/패키지 구조 정리·리팩터·최적화면 could, 그 외 기능 구현 자체·버그 수정이면 must. ⚠️ Agent는 스스로 판단해 채우지 말고 사용자에게 확인받을 것 — harness-wave.md"
      options:
        - "must — 기능 구현 자체·버그 수정"
        - "could — 성능 개선·폴더/패키지 구조 정리·리팩터·최적화"
        - "해당 없음 (문서 메타 이슈)"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 한 줄 요약
      description: 이슈 목록·알림에서 바로 읽히는 한 문장
      placeholder: 방장이 여행방을 생성하고 초대 코드를 받을 수 있다.
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 배경
      description: 왜 지금 이 이슈가 생겼는지 — 문제·모순·트리거·분리/defer 사유
      placeholder: |
        - D5 구현 중 last_activity_at hook이 create/join만 있어 #26으로 분리
        - submit·sparse·온보딩 skip이 한 세트로 모순 → 재설계 필요
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 완료 후 달라지는 상태 (한~두 문장)
      placeholder: REST API로 여행방 생성·참여·홈 Pin까지 제공한다.
    validations:
      required: true

  - type: textarea
    id: related
    attributes:
      label: 관련
      description: 스펙·결정·BR·Figma 등
      placeholder: |
        - **Spec:** docs/specs/trip/trip-room-api.md (Approved)
        - **Decision:** docs/decisions/008-trip-authorization-guard.md
        - **implements:** BR-TRIP-001, BR-USER-009

  - type: textarea
    id: dependencies
    attributes:
      label: 선행 / blocks / related
      description: "선행: 시작 전 필요 · blocks: 이 이슈가 막는 이슈 · related: 연관만"
      placeholder: |
        - **선행:** #11 · #17 · #22 (submit·참여 완료)
        - **blocks:** #13 (RESPONDED·sparse)
        - **related:** #19 · #20

  - type: textarea
    id: requirements
    attributes:
      label: 완료 조건
      description: 이 이슈 자체가 끝났다고 볼 체크리스트 (위 priority 필드의 must/could와는 다른 개념)
      placeholder: |
        - [ ] API POST /api/v1/trips
        - [ ] `./gradlew test`
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: 범위 밖
      placeholder: |
        - join 미리보기 → #19
        - 알림 → #21

  - type: textarea
    id: notes
    attributes:
      label: 비고
      placeholder: OpenAPI Hidden 유지, 수동 검증 메모 등
