name: Bug
description: 버그·오동작 보고
title: "[bug] "
labels:
  - "kind: bug"
body:
  - type: markdown
    attributes:
      value: |
        재현 단계를 모르면 **배경**만 채우고 Agent에게 로그·코드 기반으로 채워 달라고 요청해도 됩니다.
        Milestone(`MVP 출시`/`출시 이후`)은 이슈 생성 시 사이드바에서 직접 지정 — 기준: [`docs/product/development-wave.md`](../../docs/product/development-wave.md). 회귀 버그면 **관련 PR·스펙**을 배경에 적어 주세요.

  - type: dropdown
    id: priority
    attributes:
      label: priority (우선순위)
      description: "버그 수정은 거의 항상 must. ⚠️ Agent는 스스로 판단해 채우지 말고 사용자에게 확인받을 것 — harness-wave.md"
      options:
        - "must — 기능 구현 자체·버그 수정"
        - "could — 성능 개선·폴더/패키지 구조 정리·리팩터·최적화"
        - "해당 없음 (문서 메타 이슈)"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: 환경
      options:
        - local
        - dev (EC2)
        - prod
        - test / CI
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 한 줄 요약
      placeholder: Pin 해제 후에도 ongoing 캐러셀 정렬이 갱신되지 않는다.
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 배경
      description: 언제·어떤 변경 이후 발생했는지, 영향 범위
      placeholder: |
        - #12 D5 merge 이후 prod에서 재현
        - 관련 API: PATCH /api/v1/trips/{id}/pin

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 방법
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: 완료 조건
      description: 이 버그가 해결됐다고 볼 기준 (위 priority 필드의 must/could와는 다른 개념). 단순 버그면 "기대 동작대로 재현 안 됨 + 회귀 테스트 1건"처럼 짧아도 됨
      placeholder: |
        - [ ] 재현 스텝에서 기대 동작대로 동작
        - [ ] 회귀 테스트 추가

  - type: textarea
    id: logs
    attributes:
      label: 로그 / 스크린샷
      description: docker logs, stack trace, curl 응답 등

  - type: textarea
    id: related
    attributes:
      label: 관련
      placeholder: |
        - **Spec:** docs/specs/trip/trip-room-api.md §Pin
        - **related:** #12 · PR #n
